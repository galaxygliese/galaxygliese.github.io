<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="{{site_title}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fcfcfa">
<script>try{var t=localStorage.getItem("theme");if(t==="dark"){document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content="#0e1014"}}catch(e){}</script>
<link rel="icon" href="data:,">
<link rel="alternate" type="application/atom+xml" title="{{site_title}}" href="/feed.xml">
<link rel="stylesheet" href="/static/css/style.css">
{{head_extra}}
<script src="/static/js/gravity.js" defer></script>
</head>
<body>
<canvas id="spacetime" aria-hidden="true"></canvas>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <a class="logo" href="/">{{site_title}}</a>
  <nav aria-label="Main">
    <a href="/"{{nav_home}}>Home</a>
    <a href="/ai/"{{nav_ai}}>AI</a>
    <a href="/physics/"{{nav_physics}}>Physics</a>
    <a href="/about/"{{nav_about}}>About</a>
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </nav>
</header>
<main id="main"{{main_class}}>
{{content}}
</main>
<footer class="site-footer">
  <span>© {{year}} {{author}}</span>{{footer_links}}
</footer>
{{body_end}}
<script>document.querySelector(".theme-toggle").addEventListener("click",function(){var r=document.documentElement,t=r.dataset.theme==="dark"?"light":"dark";r.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}document.querySelector('meta[name="theme-color"]').content=t==="dark"?"#0e1014":"#fcfcfa";dispatchEvent(new Event("themechange"))})</script>
</body>
</html>
